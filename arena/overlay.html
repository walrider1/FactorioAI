<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocket Run Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Stream overlay for OBS (browser source, 1920x1080, transparent). Built on a 1920x1080 stage that scales to the
   source size. It keeps to the edges so the game stays visible:
     top strip     the road to the rocket as speedrun splits (in-game times) and the in-game clock
     right         the brain's thoughts (strategist, overseer, assessor, rules) and research
     bottom left   the brain as a live state machine
     bottom bar    the current instruction, the hands, the last goals
   URL options: ?run=ID (default: the run that is playing) · ?demo=1 (fake data to place it in OBS) ·
   ?thoughts=0 · ?brain=0 (hide a panel) · ?bg=1 (dark backdrop, to check it outside OBS) ·
   ?pb=map (race the best earlier run on the same map; default: the best earlier run of the task on any map)
   Look: cut steel plates, hazard stripes for anything working. One accent (orange) plus neutrals; red only for
   "something went wrong". Every text box has a fixed height and clamps its lines, so nothing grows. */
:root {
  --plate: rgba(20, 19, 17, .93); --plate-hi: rgba(32, 30, 27, .96); --well: #2a2725;
  --line: #3d3934; --line-hi: #57514a;
  --ink: #f4efe6; --muted: #a8a197; --dim: #6f6960;
  --acc: #ff9a1f; --acc-lo: #c76800; --acc-ink: #1f1306; --acc-bg: rgba(255, 154, 31, .13);
  --bad: #ff5340;
  --cut: 12px;
  --f-d: "Barlow Condensed", "Arial Narrow", sans-serif; --f-b: "Barlow", system-ui, sans-serif;
  --f-m: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --hazard: repeating-linear-gradient(-45deg, var(--acc) 0 7px, var(--acc-ink) 7px 14px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; color: var(--ink); font-family: var(--f-b); }
body.bg { background: radial-gradient(circle at 50% 42%, #3a382d, #191813 75%); }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }

/* a plate with two cut corners and a hairline edge */
.plate { position: absolute; background: var(--plate); box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 1px rgba(255, 255, 255, .03);
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
.hd { display: flex; justify-content: space-between; align-items: center; gap: 10px; height: 16px; font: 700 12px/1 var(--f-m); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
.hd .t { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
.hd .t::before { content: ""; width: 8px; height: 8px; background: var(--acc); }
.hd b { color: var(--ink); font-weight: 700; letter-spacing: .04em; }
.clamp1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clamp2 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.pop { animation: pop .5s cubic-bezier(.25, 1.8, .45, 1); }
@keyframes pop { 0% { transform: scale(1.4); filter: brightness(1.7); } 100% { transform: none; filter: none; } }
@keyframes blink { 50% { opacity: .2; } }
@keyframes march { to { background-position: 28px 0; } }
.hide { display: none !important; }

/* ---------------------------------------------------------------- top strip: splits + clock */
#top { left: 24px; right: 24px; top: 16px; height: 64px; display: grid; grid-template-columns: 124px 1fr 132px 206px; align-items: stretch; }
/* the show's counters: run number of the stream, self-upgrades so far */
.tally { display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 0 16px; border-left: 1px solid var(--line); }
.tally div { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; white-space: nowrap; }
.tally span { font: 700 10px/1 var(--f-m); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.tally b { font: 700 20px/1 var(--f-m); color: var(--ink); }
.tally b.up { color: var(--acc); }
.tally b.pop { animation: pop .6s ease-out; }
.lead { display: flex; flex-direction: column; justify-content: center; gap: 5px; padding-left: 18px; border-right: 1px solid var(--line); }
.lead .vs { font: 700 10px/1 var(--f-m); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
/* deltas against the personal best: orange ahead, red behind, a filled chip for a best-ever ("gold") split */
.sp .dl { font: 700 12px/1 var(--f-m); margin-left: 3px; }
.sp .dl.ahead { color: var(--acc); } .sp .dl.behind { color: var(--bad); }
.sp .dl.gold { color: var(--acc-ink); background: var(--acc); padding: 0 3px; }
.sp .dl.pb { color: var(--muted); margin-left: 0; }
.live { display: inline-flex; align-items: center; gap: 7px; font: 700 13px/1 var(--f-m); letter-spacing: .14em; color: var(--ink); }
.live::before { content: ""; width: 9px; height: 9px; background: var(--bad); animation: blink 1.6s infinite; }
.live.off { color: var(--dim); } .live.off::before { background: var(--dim); animation: none; }
.lead .pct { font: 700 22px/1 var(--f-m); color: var(--acc); }
.lead .pct small { font: 700 11px/1 var(--f-m); letter-spacing: .1em; color: var(--dim); margin-left: 4px; }
#splits { display: grid; gap: 3px; padding: 9px 14px 0; min-width: 0; }
.sp { min-width: 0; display: grid; row-gap: 5px; align-content: start; padding-right: 6px; }
.sp .seg { height: 8px; background: var(--well); margin-right: -6px; }
.sp.done .seg { background: var(--acc); }
.sp.now .seg { background: var(--hazard); background-size: 28px 28px; animation: march .9s linear infinite; }
.sp .nm { font: 700 15px/1 var(--f-d); letter-spacing: .05em; text-transform: uppercase; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp .tm { font: 500 13px/1 var(--f-m); color: var(--dim); white-space: nowrap; height: 13px; }
.sp.done .nm { color: var(--muted); } .sp.done .tm { color: var(--ink); }
.sp.now .nm { color: var(--ink); } .sp.now .tm { color: var(--acc); }
.clock { display: flex; flex-direction: column; justify-content: center; align-items: flex-end; gap: 5px; padding-right: 20px; border-left: 1px solid var(--line); }
.clock .t { font: 700 32px/1 var(--f-m); letter-spacing: -.02em; }
.clock .cap { font: 700 11px/1 var(--f-m); letter-spacing: .16em; text-transform: uppercase; color: var(--acc); }
.clock .cap.frozen { color: var(--dim); }

/* ---------------------------------------------------------------- right: thoughts + research */
#thoughts { right: 24px; top: 94px; width: 372px; height: 548px; padding: 14px 16px; display: grid; grid-template-rows: auto auto 1fr auto; }
.thinking { height: 0; overflow: hidden; transition: height .3s, margin .3s; }
.thinking.on { height: 34px; margin-top: 10px; }
.thinking > div { position: relative; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px 0 16px; background: var(--acc-bg); box-shadow: inset 0 0 0 1px var(--acc); font: 700 16px/1 var(--f-d); letter-spacing: .08em; text-transform: uppercase; }
.thinking > div::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: var(--hazard); background-size: 28px 28px; animation: march .9s linear infinite; }
.thinking .s { margin-left: auto; font: 500 14px/1 var(--f-m); color: var(--muted); letter-spacing: 0; text-transform: none; }
#feed { margin-top: 6px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 82%, transparent); mask-image: linear-gradient(#000 82%, transparent); }
.th { padding: 11px 0; border-top: 1px dashed var(--line); }
.th:first-child { border-top: 0; }
.th .meta { display: flex; align-items: center; gap: 8px; }
.th .m { font: 500 12px/1 var(--f-m); color: var(--dim); }
.th .txt { font: 600 17px/1.28 var(--f-b); margin-top: 7px; max-height: 44px; }
.th .ord { font: 600 14px/1.2 var(--f-b); color: var(--acc); margin-top: 5px; }
.th .ord::before { content: "» "; }
.th.old .txt { color: var(--muted); }
.th.new { animation: slidein .5s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes slidein { from { transform: translateX(24px); opacity: 0; } }
.who { flex: none; font: 700 12px/1 var(--f-m); letter-spacing: .1em; text-transform: uppercase; padding: 4px 6px; color: var(--muted); background: var(--well); }
.who.strategist { color: var(--ink); box-shadow: inset 0 0 0 1px var(--acc); background: none; }
.who.overseer, .who.milestone { color: var(--acc-ink); background: var(--acc); }
.who.rules, .who.watchdog { color: #fff; background: var(--bad); }
.research { border-top: 1px solid var(--line); margin: 0 -16px; padding: 12px 16px 0; }
.research .row { display: flex; align-items: baseline; gap: 10px; margin-top: 8px; }
.research .tech { flex: 1; min-width: 0; font: 800 20px/1 var(--f-d); text-transform: uppercase; letter-spacing: .02em; }
.research .tech.idle { color: var(--bad); }
.research .p { font: 500 13px/1 var(--f-m); color: var(--dim); }
.meter { position: relative; height: 6px; background: var(--well); margin-top: 8px; }
.meter i { display: block; height: 100%; width: 0; background: var(--acc); transition: width 1s linear; }
.meter i.ok { background: #e8e2d8; } .meter i.hot { background: var(--bad); }
.packs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 10px; }
.pk { display: flex; align-items: baseline; justify-content: center; gap: 5px; padding: 6px 0; background: var(--well); }
.pk .v { font: 700 16px/1 var(--f-m); }
.pk .k { font: 700 11px/1 var(--f-d); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.pk.on { background: none; box-shadow: inset 0 0 0 1px var(--acc); } .pk.on .k { color: var(--muted); }
.pk.off { opacity: .3; }

/* ---------------------------------------------------------------- bottom left: the brain as a state machine */
#brain { left: 24px; bottom: 16px; width: 392px; height: 264px; padding: 14px 14px 0; }
#fsm { display: block; width: 364px; height: 205px; margin-top: 10px; overflow: visible; }
#fsm .n > rect { fill: #1d1b19; stroke: var(--line-hi); stroke-width: 1.5; }
#fsm .n > text { fill: var(--muted); font: 700 15px var(--f-d); letter-spacing: .1em; text-transform: uppercase; }
#fsm .n > text.s { fill: var(--dim); font: 500 12.5px var(--f-m); letter-spacing: 0; text-transform: none; }
#fsm .n.on > rect { fill: var(--acc-bg); stroke: var(--acc); stroke-width: 2.5; }
#fsm .n.on > text { fill: var(--ink); } #fsm .n.on > text.s { fill: var(--muted); }
#fsm .n.busy > rect { fill: url(#hz); stroke: var(--acc); stroke-width: 2.5; }
#fsm .n.busy > text { fill: var(--ink); } #fsm .n.busy > text.s { fill: var(--ink); }
#fsm .n.flash > rect { fill: var(--acc); stroke: var(--acc); } #fsm .n.flash > text { fill: var(--acc-ink); }
#fsm .n.alarm > rect { fill: var(--bad); stroke: var(--bad); } #fsm .n.alarm > text { fill: #fff; }
#fsm .w { fill: none; stroke: var(--line-hi); stroke-width: 2.5; }
#fsm .w.dash { stroke-dasharray: 4 4; }
#fsm .w.hot { stroke: var(--acc); stroke-dasharray: 8 6; animation: flow .6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -14; } }
#fsm .c rect { fill: none; stroke: var(--line); stroke-width: 1.5; }
#fsm .c text { fill: var(--dim); font: 600 13.5px var(--f-m); }
#fsm .c.on rect { fill: var(--acc); stroke: var(--acc); } #fsm .c.on text { fill: var(--acc-ink); font-weight: 700; }
#fsm .c.was rect { stroke: var(--acc); } #fsm .c.was text { fill: var(--muted); }
#fsm marker path { fill: var(--line-hi); }

/* ---------------------------------------------------------------- bottom bar: instruction, hands, last goals */
#bar { left: 432px; right: 24px; bottom: 16px; height: 98px; display: grid; grid-template-columns: 1fr 330px 300px; --cut: 14px; }
#bar::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: var(--acc); }
#bar > div { min-width: 0; padding: 13px 18px 0; }
#bar > div + div { border-left: 1px solid var(--line); }
.cmd { padding-left: 26px !important; }
.cmd .row { display: flex; align-items: center; gap: 12px; margin-top: 7px; }
.cmd .doing { min-width: 0; flex: 1; font: 800 30px/1.1 var(--f-d); letter-spacing: .01em; }
.cmd .why { margin-top: 5px; font: 500 15px/1.2 var(--f-b); color: var(--muted); }
.cmd .why i { font: 700 11px/1 var(--f-m); font-style: normal; letter-spacing: .12em; color: var(--dim); margin-right: 8px; }
.hands .step { margin-top: 8px; font: 800 22px/1 var(--f-d); letter-spacing: .05em; text-transform: uppercase; color: var(--acc); }
.hands .act { margin-top: 5px; font: 500 15px/1.2 var(--f-b); color: var(--muted); }
.log .sq { display: flex; gap: 4px; margin-top: 8px; height: 22px; }
.log .sq span { flex: none; display: grid; place-items: center; width: 22px; height: 22px; font: 800 14px/1 var(--f-d); color: var(--acc); background: var(--well); }
.log .sq span.bad { color: #fff; background: var(--bad); }
.log .sq span.new { animation: pop .5s cubic-bezier(.25, 1.8, .45, 1); }
.log .last { margin-top: 7px; font: 500 15px/1.2 var(--f-b); color: var(--muted); }

/* ---------------------------------------------------------------- pop-ups */
#toasts { position: absolute; left: 50%; top: 110px; transform: translateX(-50%); display: grid; gap: 14px; justify-items: center; pointer-events: none; }
.toast { --cut: 18px; position: relative; min-width: 560px; max-width: 820px; text-align: center; padding: 26px 40px 24px; background: var(--plate-hi); box-shadow: inset 0 0 0 2px var(--line-hi);
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  animation: slam .5s cubic-bezier(.2, 1.4, .4, 1), fade .5s ease-in forwards; animation-delay: 0s, var(--life, 7s); }
.toast::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 8px; background: var(--hazard); background-size: 28px 28px; animation: march .9s linear infinite; }
.toast .big { font: 800 52px/1 var(--f-d); letter-spacing: .04em; text-transform: uppercase; }
.toast .small { font: 600 22px/1.28 var(--f-b); color: var(--muted); margin-top: 10px; }
.toast.ms { background: var(--acc); color: var(--acc-ink); box-shadow: none; }
.toast.ms::before { background: repeating-linear-gradient(-45deg, var(--acc-ink) 0 7px, var(--acc) 7px 14px); background-size: 28px 28px; }
.toast.ms .small { color: rgba(31, 19, 6, .75); }
.toast.ov { box-shadow: inset 0 0 0 2px var(--acc); } .toast.ov .big { color: var(--acc); }
@keyframes slam { from { transform: translateY(-40px) scale(1.15); opacity: 0; } }
@keyframes fade { to { transform: translateY(-16px); opacity: 0; } }
.confetti { position: absolute; top: 0; width: 12px; height: 12px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(1150px) rotate(540deg); } }
/* ---------------------------------------------------------------- sound: the unlock badge (outside OBS only) and ?sfxtest=1 */
#sfxBadge { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); padding: 8px 14px; font: 700 13px/1 var(--f-m); letter-spacing: .14em; color: var(--acc-ink); background: var(--acc); cursor: pointer; }
#sfxTest { --cut: 14px; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 560px; padding: 16px 18px 18px; }
#sfxTest .btns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 14px; }
#sfxTest button { all: unset; cursor: pointer; padding: 12px 14px; background: var(--well); box-shadow: inset 0 0 0 1px var(--line-hi); font: 800 20px/1 var(--f-d); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); display: flex; justify-content: space-between; }
#sfxTest button small { font: 500 12px/20px var(--f-m); color: var(--dim); text-transform: none; letter-spacing: 0; }
#sfxTest button:hover { box-shadow: inset 0 0 0 2px var(--acc); }
#sfxTest button:active { background: var(--acc); color: var(--acc-ink); }
@media (prefers-reduced-motion: reduce) { *, *::after, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="stage">
  <div class="plate" id="top">
    <div class="lead"><span class="live" id="live">LIVE</span><span class="pct"><span id="pct">0%</span><small>ROCKET</small></span><span class="vs" id="vsPb"></span></div>
    <div id="splits"></div>
    <div class="tally"><div><span>Run</span><b id="runNo">#1</b></div><div><span>Upgrades</span><b class="up" id="upNo">0</b></div></div>
    <div class="clock"><div class="t" id="clock">0:00:00</div><div class="cap" id="clockCap">in-game time</div></div>
  </div>

  <div class="plate" id="thoughts">
    <div class="hd"><span class="t">Brain // thoughts</span><span id="calls"></span></div>
    <div class="thinking" id="thinking"><div><span id="thinkWho">Strategist</span><span class="s" id="thinkFor"></span></div></div>
    <div id="feed"></div>
    <div class="research">
      <div class="hd"><span class="t">Research</span><span class="p" id="techPct"></span></div>
      <div class="row"><span class="tech clamp1" id="tech">–</span></div>
      <div class="meter"><i id="techBar"></i></div>
      <div class="packs" id="packs"></div>
    </div>
  </div>

  <div class="plate" id="brain">
    <div class="hd"><span class="t">Brain // control loop</span><span>bill <b id="bill">$0.00</b></span></div>
    <svg id="fsm" viewBox="0 0 440 248" aria-label="The bot's control loop">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker>
        <pattern id="hz" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="14" height="14" fill="#2a1c0c"/><rect width="5" height="14" fill="#ff9a1f" opacity=".45"/>
          <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="14 0" dur=".9s" repeatCount="indefinite" additive="sum"/>
        </pattern>
      </defs>
      <path class="w" id="e-strategist" d="M46 48 V88" marker-end="url(#ah)"/>
      <path class="w dash" id="e-overseer" d="M222 48 V66" marker-end="url(#ah)"/>
      <path class="w dash" id="e-supervisor" d="M374 48 V58 H316 V66" marker-end="url(#ah)"/>
      <path class="w" id="e-take-goal-run-goal" d="M92 113 H104" marker-end="url(#ah)"/>
      <path class="w" id="e-run-goal-record" d="M336 96 H348" marker-end="url(#ah)"/>
      <path class="w" id="e-record-replan" d="M394 116 V128" marker-end="url(#ah)"/>
      <path class="w" id="e-replan-take-goal" d="M394 172 V188 H46 V140" marker-end="url(#ah)"/>
      <path class="w dash" id="e-foreman" d="M222 182 V200"/>
      <g class="n" id="n-strategist"><rect x="0" y="0" width="136" height="48"/><text x="68" y="21" text-anchor="middle">Strategist</text><text class="s" id="stratSub" x="68" y="39" text-anchor="middle">plans goals</text></g>
      <g class="n" id="n-overseer"><rect x="152" y="0" width="140" height="48"/><text x="222" y="21" text-anchor="middle">Overseer</text><text class="s" id="ovSub" x="222" y="39" text-anchor="middle">audits base</text></g>
      <g class="n" id="n-supervisor"><rect x="304" y="0" width="136" height="48"/><text x="372" y="21" text-anchor="middle">Supervisor</text><text class="s" id="supSub" x="372" y="39" text-anchor="middle">rules+assess</text></g>
      <g class="n" id="n-take-goal"><rect x="0" y="90" width="92" height="48"/><text x="46" y="111" text-anchor="middle">Next</text><text x="46" y="128" text-anchor="middle">goal</text></g>
      <g class="n" id="n-run-goal"><rect x="106" y="68" width="230" height="114"/><text x="221" y="88" text-anchor="middle">Run goal</text><g id="chips"></g></g>
      <g class="n" id="n-record"><rect x="350" y="76" width="90" height="40"/><text x="395" y="101" text-anchor="middle">Record</text></g>
      <g class="n" id="n-replan"><rect x="350" y="130" width="90" height="42"/><text x="395" y="156" text-anchor="middle">Replan?</text></g>
      <g class="n" id="n-foreman"><rect x="0" y="200" width="440" height="48"/><text x="14" y="229">Foreman</text><g id="fchips"></g></g>
    </svg>
  </div>

  <div class="plate" id="bar">
    <div class="cmd">
      <div class="hd"><span class="t">Current instruction</span><span id="whoTag" class="who">strategist</span></div>
      <div class="row"><span class="doing clamp1" id="doing">warming up…</span></div>
      <div class="why clamp1" id="why"></div>
    </div>
    <div class="hands">
      <div class="hd"><span class="t">Hands</span><span><b id="tUsed">0:00</b> / <span id="tBudget">–</span></span></div>
      <div class="step clamp1" id="handStep">idle</div>
      <div class="act clamp1" id="handAct"></div>
    </div>
    <div class="log">
      <div class="hd"><span class="t">Last goals</span><span id="okRate"></span></div>
      <div class="sq" id="sq"></div>
      <div class="last clamp1" id="last"></div>
    </div>
  </div>
  <div id="toasts"></div>
  <div id="sfxBadge" class="hide">SOUND OFF · CLICK TO ENABLE</div>
  <div class="plate hide" id="sfxTest"><div class="hd"><span class="t">Sound check</span><span>?vol= sets the level</span></div><div class="btns" id="sfxBtns"></div></div>
</div>

<script>
const Q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------------------------------------------------------------- sound
// Every effect is synthesised once at load (an OfflineAudioContext per sound) and then played from a buffer.
// One palette so they belong together: D major, struck steel and bells, one reverb room, the same saturation
// and compressor on every sound. In OBS tick "Control audio via OBS" on the browser source to get a fader.
// ?sfx=0 turns it off, ?vol=0.5 sets the level (default 0.8), ?sfxtest=1 shows a button for each sound.
const SFX = (() => {

    const ir = c.createBuffer(2, Math.floor(SR * 1.9), SR);

function renderTop(d, L, stages) {
  const playing = isPlaying(d, L);
  $("live").textContent = playing ? "LIVE" : d.finished ? "ENDED" : "PAUSED"; $("live").classList.toggle("off", !playing);
  setText("clock", fmtClock(L.game_minute));
  const S = d.stream || {};
  if (S.run_no) setText("runNo", "#" + S.run_no);
  const up = String(S.upgrades ?? 0);
  if ($("upNo").textContent !== up) { $("upNo").textContent = up; $("upNo").classList.remove("pop"); void $("upNo").offsetWidth; $("upNo").classList.add("pop"); }
  // the clock is the game's: it stops while the world is paused, so say so
  setText("clockCap", playing ? "in-game time" : "in-game · paused"); $("clockCap").classList.toggle("frozen", !playing);
  if (!stages.length) return;
  $("splits").style.gridTemplateColumns = `repeat(${stages.length}, minmax(0, 1fr))`;
  const done = stages.filter(s => s.done).length, nowIdx = stages.findIndex(s => s.status === "now");
  const at = stages.map(s => s.done ? splitMinute(s, L.milestones, d.splits) : null);
  const prev = Math.max(0, ...at.filter(v => v != null));   // the current split runs from the last cleared one
  // racing the personal best: how each cleared stage compares, and the target for the one in hand
  const pb = d.pb || null, pbs = (pb && pb.splits) || {}, best = (pb && pb.best) || {};
  const vs = i => {
    const s = stages[i], mine = at[i], theirs = pbs[s.name];
    if (mine == null || theirs == null) return null;
    return { d: mine - theirs, gold: best[s.name] != null && mine < best[s.name] };
  };
  const gm = L.game_minute || 0;
  setHTML("splits", stages.map((s, i) => {
    const st = s.done ? "done" : s.status === "now" ? "now" : "";
    let tm = "";
    if (s.done) {
      const v = vs(i);
      tm = (at[i] != null ? fmtHM(at[i]) : "✓")
        + (v ? ` <span class="dl ${v.gold ? "gold" : v.d <= 0 ? "ahead" : "behind"}">${v.gold ? "★" : ""}${fmtDelta(v.d)}</span>` : "");
    } else if (s.status === "now") {
      const target = pbs[s.name];
      tm = target == null ? "▶ " + fmtHM(Math.max(0, gm - prev))
        : gm <= target ? `<span class="dl pb">PB ${fmtHM(target)}</span>` : `<span class="dl behind">PB ${fmtDelta(gm - target)}</span>`;
    }
    return `<div class="sp ${st}" title="${esc(s.name)}"><div class="seg"></div><div class="nm">${esc(short(s.name))}</div><div class="tm">${tm}</div></div>`;

  setNum("pct", Math.round((done + (nowIdx >= 0 ? .5 : 0)) / stages.length * 100) + "%");
  setText("vsPb", pb ? `vs PB of ${pb.runs}` : "first run");

}

function renderBar(d, L) {

  setText("handStep", top ? (STEP[top] || top) : cg && playing ? "working" : "idle");
  setText("handAct", L.activity || "");

  setText("tUsed", fmt(used)); setText("tBudget", budget ? fmt(budget) : "no limit");

}

function renderBrain(d, L) {
  const playing = isPlaying(d, L);
  // a stopped run keeps its last flags: nobody is thinking any more
  const st = playing ? L.stage || {} : { ...(L.stage || {}), thinking: false, foreman: null, steps: [] };
  const strat = playing ? L.strategist || {} : { ...(L.strategist || {}), thinking_since: null, ready_since: null };
  const ov = playing ? L.overseer || {} : { ...(L.overseer || {}), thinking: false, next_minute: null };
  const now = d.now || Date.now() / 1000, evs = L.events || [];
  const recent = (kind, who) => playing && evs.some(e => e.kind === kind && (!who || e.who === who) && now - (e.t || 0) < 12);
  document.querySelectorAll("#fsm .n").forEach(n => n.classList.remove("on", "busy", "flash", "alarm"));
  document.querySelectorAll("#fsm .c").forEach(c => c.classList.remove("on", "was"));
  document.querySelectorAll("#fsm .w").forEach(w => w.classList.remove("hot"));
  const main = MAINS.includes(st.main) ? st.main : null;
  if (main && $("n-" + main)) $("n-" + main).classList.add("on");
  const steps = st.steps || [];
  steps.forEach((s, i, a) => { const k = s in STEP_CHIP ? STEP_CHIP[s] : s, c = k && $("s-" + k); if (c) c.classList.add(i === a.length - 1 ? "on" : "was"); });
  const wire = { "run-goal": "e-take-goal-run-goal", record: "e-run-goal-record", replan: "e-record-replan", "take-goal": "e-replan-take-goal" }[main];

// a decision in the brain, as the viewer reads it
function thought(e) {
  const m = e.minute != null ? fmt(e.minute) : "";
  const ord = (e.changes || []).map(sayChange).filter(Boolean)[0] || "";
  switch (e.kind) {
    case "plan": return { who: "strategist", m, txt: e.note || "New plan.", ord: (e.goals || []).length ? `queued ${e.goals.length} goals` : "" };
    case "oversee": return { who: "overseer", m, txt: firstSentence(e.note, 200), ord };
    case "assess": return { who: e.who === "rules" ? "rules" : "assessor", m, txt: e.note || "", ord };
    case "fix": return { who: "fixer", m, txt: e.note || e.why || "", ord: e.why ? "because " + e.why : "" };
    case "watchdog": return { who: "watchdog", m, txt: `No progress for ${Math.round(e.minutes_without_progress || 0)} game minutes: shaking things up`, ord: e.action ? "action: " + e.action : "" };
    case "closeout": return { who: "strategist", m, txt: "Close-out: " + (e.why || ""), ord: (e.goals || []).length ? `queued ${e.goals.length} goals` : "" };
    case "gate": return { who: "rules", m, txt: firstSentence(e.why, 180), ord: e.goal ? "held back: " + sayText(e.goal) : "" };
    case "milestone": return { who: "milestone", m, txt: "Milestone reached: " + (e.ids || []).join(", "), ord: "" };
    default: return null;
  }
}

function renderThoughts(L) {
  const evs = (L.events || []).slice().reverse();
  const items = evs.map(e => [e, thought(e)]).filter(([, t]) => t && t.txt).slice(0, 6);
  const sig = items.map(([e]) => `${e.kind}@${e.t}`).join("|");
  if (sig === seenThoughts) return;
  const firstNew = seenThoughts != null, before = new Set((seenThoughts || "").split("|"));
  $("feed").innerHTML = items.map(([e, t], i) => `<div class="th ${firstNew && !before.has(`${e.kind}@${e.t}`) ? "new" : ""} ${i > 1 ? "old" : ""}">
      <div class="meta"><span class="who ${t.who}">${esc(t.who)}</span><span class="m">${esc(t.m)}</span></div>
      <div class="txt clamp2">${esc(t.txt)}</div>${t.ord ? `<div class="ord clamp1">${esc(t.ord)}</div>` : ""}</div>`).join("")
    || '<div class="th"><div class="txt" style="color:var(--dim)">The brain\'s decisions show up here.</div></div>';
  // pop-ups: the overseer giving orders, a milestone
  const ovs = evs.find(e => e.kind === "oversee"), ms = evs.find(e => e.kind === "milestone");
  const sounds = [];
  if (ovs && lastOv != null && ovs.t !== lastOv && (ovs.changes || []).some(c => /drop the goal|pause the goal|forbid|order:/.test(c))) {
    toast("ov", "Overseer steps in", firstSentence(ovs.note, 150), 8); sounds.push("overseer");
  }
  if (ms && seenMs != null && ms.t !== seenMs) { toast("ms", "Milestone", (ms.ids || []).join(", "), 9); confetti(); sounds.push("milestone"); }
  // the smaller decisions get a sound too: a rule or the watchdog stepping in, a new plan or a reorder
  if (firstNew) for (const [e] of items) {
    if (before.has(`${e.kind}@${e.t}`)) continue;
    if ((e.kind === "assess" && e.who === "rules") || e.kind === "watchdog" || e.kind === "gate") sounds.push("alarm");
    else if (e.kind === "plan" || e.kind === "closeout" || e.kind === "assess") sounds.push("plan");

  if (sounds.length) SFX.play(sounds.sort((a, b) => rank(b) - rank(a))[0]);

}

function render(d) {
  const L = d.live || {}, rm = L.roadmap || {}, stages = rm.stages || [];
  // each part on its own: one odd field never blanks the rest of the overlay
  for (const part of [() => renderTop(d, L, stages), () => renderBar(d, L), () => renderBrain(d, L),
    () => renderThoughts(L), () => renderResearch(L, rm)]) {
    try { part(); } catch (e) { console.error(e); }
  }
}
