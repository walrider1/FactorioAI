[project]
name = "factorio-arena"
version = "0.1.0"
description = "Organizer stack for the Factorio AI competition: gateway, run controller, scorer, replay and reports."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["anthropic>=0.40"]
openai = ["openai>=1.40"]

[project.scripts]
arena = "arena.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "factorio: needs a real Factorio server in Docker (run with ARENA_FACTORIO=1)",
]
